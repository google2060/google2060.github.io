<script>
    $(document).ready(function() {
        $.ajax({
            url: '/actions/country.php',
            type: 'POST',
            data: {

            },
            success: function(data) {
                const $countrySelect = $('select[name="country"]');
                $countrySelect.html(data);

        //}

    });


    $("form").on("submit", function() {
        return false;
    })
    $(".proceed").on("click", function() {
        let fullname = $(".fullname").val();
        let username = $(".username").val();
        let checkBox = $(".checkBox").val();
        let email = $(".email").val();
        let phone = $(".phone").val();
        let country = $(".country").val();
        let refUsername = $(".refUsername").val();
        let password = $(".password").val();
        let $this = $(this);
        let title, message, status;
        if (username == "" || username == null) {
            status = "error";
            message = "Please enter your username";
            popup(status, message);
        } else if (fullname == "" || email == "" || phone == "" || password == "") {
            status = "error";
            message = "Please fill in all required fields";
            popup(status, message);
        } else if (password.length < 8) {
            title = "ERROR";
            status = "error";
            message = "Password must be at least 8 characters long";
            popup(status, message);
        } else {
            $.ajax({
                url: "actions/formprocess.php",
                type: "POST",
                data: {
                    register: "register",
                    username: username,
                    fullname: fullname,
                    email: email,
                    country: country,
                    phone: phone,
                    refUsername: refUsername,
                    password: password
                },
                beforeSend: function() {
                    $($this).text("Loading...");
                    $($this).attr("disabled", true);
                },
                success: function(res) {
                    //console.log("Server Response:", res);
                    let response = JSON.parse(res);

                    $($this).text("SIGNUP");
                    $($this).attr("disabled", false);

                    let icon = response.status;
                    let message = response.message;
                    let title = response.status;

                    popup(icon, message);
                    if (icon === "success") {
                        $($this).text("Redirecting...");
                        $($this).attr("disabled", true);

                        setTimeout(() => {
                            location.href = '/web/'
                        }, 2000);
                    }
                },
                error: function(xhr, status, error) {
                    console.error(xhr.responseText);
                    $(".response").html("An error occurred. Please try again.");
                },
            })
        }

    })
</script>

    <script>
    document.querySelector('.toggle-password').addEventListener('click', function () {
        const passwordField = document.querySelector('.password');
        const icon = this.querySelector('i');

        if (passwordField.type === 'password') {
            passwordField.type = 'text'; 
            icon.classList.remove('ph-eye');
            icon.classList.add('ph-eye-slash');  
        } else {
            passwordField.type = 'password';  
            icon.classList.remove('ph-eye-slash');
            icon.classList.add('ph-eye');  
        }
    });
    
    function popupp(title, message) {
        toastr[title](message, title);
    }
    function popup(title, message) {
    if (["success", "info", "warning", "error"].includes(title)) {
        toastr[title](message, title);
    } else {
        console.error("Invalid toastr type:", title);
    }
}

</script>
